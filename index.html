<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dwarka · Private Project Discussion</title>
<meta name="description" content="Private project discussion · by registration only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1a36; --navy-2:#11264c; --navy-3:#1a3360;
    --green:#7cc242; --green-dk:#4f8f22;
    --gold:#d4b26a; --gold-lt:#efdcaa;
    --white:#ffffff; --ink:#0b1a36; --muted:#5a6680; --line:#e3e7ef; --paper:#f6f8fb;
    --err:#b3261e;
    --head:Montserrat,Inter,sans-serif; --body:Inter,system-ui,sans-serif;
  }
  html[lang=hi]{--head:"Noto Sans Devanagari",Montserrat,sans-serif; --body:"Noto Sans Devanagari",Inter,sans-serif}
  html[lang=gu]{--head:"Noto Sans Gujarati",Montserrat,sans-serif; --body:"Noto Sans Gujarati",Inter,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink); font:16px/1.6 var(--body); -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--head); line-height:1.25; margin:0}
  a{color:inherit}
  .wrap{max-width:1040px; margin:0 auto; padding:0 16px}

  /* ---------- language chooser ---------- */
  .langgate{position:fixed; inset:0; z-index:50; background:rgba(7,18,39,.96); display:flex; align-items:center; justify-content:center; padding:16px}
  .langgate[hidden]{display:none}
  .langbox{background:var(--navy); border:1px solid var(--gold); border-radius:16px; padding:28px 22px; width:100%; max-width:380px; text-align:center; color:#fff}
  .langbox .t{font:800 30px/1.1 Montserrat,sans-serif; letter-spacing:.08em; margin:0 0 6px}
  .langbox p{margin:0 0 20px; color:var(--gold-lt); font:600 15px/1.6 "Noto Sans Gujarati","Noto Sans Devanagari",Inter,sans-serif}
  .langbox button{display:block; width:100%; margin:10px 0 0; padding:15px; border-radius:10px; border:1.5px solid var(--green);
    background:transparent; color:#fff; cursor:pointer; font:700 19px/1.2 "Noto Sans Gujarati","Noto Sans Devanagari",Montserrat,sans-serif}
  .langbox button:hover, .langbox button:focus{background:var(--green); color:var(--navy); outline:none}
  .langbar{display:flex; justify-content:flex-end; gap:6px; padding-bottom:14px}
  .langbar button{background:transparent; border:1px solid var(--navy-3); color:#c9d2e3; border-radius:999px; padding:5px 12px; cursor:pointer;
    font:600 13px/1.2 "Noto Sans Gujarati","Noto Sans Devanagari",Inter,sans-serif}
  .langbar button[aria-pressed=true]{border-color:var(--green); color:#fff; background:var(--navy-2)}

  /* ---------- hero ---------- */
  .hero{background:var(--navy); color:var(--white); padding:14px 0 0; text-align:center}
  .conf-pill{display:inline-block; border:1px solid var(--gold); color:var(--gold-lt); border-radius:999px;
    padding:6px 16px; font:600 12px/1.4 var(--head); letter-spacing:.12em; text-transform:uppercase}
  .hero h1{font:800 clamp(46px,11vw,96px)/1.15 Montserrat,sans-serif; letter-spacing:.06em; margin:18px 0 6px}
  .hero .sub{font:600 clamp(18px,3.6vw,28px)/1.35 var(--head); color:#e8ecf5; margin:0}
  .hero .tag{display:block; margin:14px 0 24px; color:var(--green); font:700 15px/1.5 var(--head); letter-spacing:.02em}
  .hero-actions{margin:0 0 28px}

  .figure{position:relative; margin:0; max-width:1240px; margin-inline:auto}
  .figure img{display:block; width:100%; height:auto; aspect-ratio:1672/941; object-fit:cover; background:var(--navy-2)}
  .figure figcaption{background:var(--navy-2); color:#c9d2e3; font-size:13px; padding:10px 16px; text-align:center; border-top:2px solid var(--gold)}
  .figure .badge{position:absolute; left:12px; top:12px; background:rgba(11,26,54,.86); color:#fff;
    font:700 11px/1.2 var(--head); letter-spacing:.1em; padding:7px 10px; border-radius:4px; text-transform:uppercase}

  .btn{display:inline-block; border:0; cursor:pointer; text-decoration:none; border-radius:8px; font:700 16px/1.2 var(--head); padding:16px 24px}
  .btn-green{background:var(--green); color:var(--navy)}
  .btn-green:hover{background:#8fd352}
  .btn:disabled{opacity:.6; cursor:wait}

  /* ---------- confidentiality ---------- */
  .notice{background:#fff8e6; border-bottom:1px solid #ecd9a6; color:#5b4613; font-size:14.5px}
  .notice .wrap{padding-top:14px; padding-bottom:14px; display:flex; gap:10px; align-items:flex-start}
  .notice svg{flex:none; margin-top:3px}

  /* ---------- sections ---------- */
  section.block{padding:52px 0}
  section.block + section.block{padding-top:0}
  .eyebrow{font:700 12px/1.3 var(--head); letter-spacing:.14em; text-transform:uppercase; color:var(--green-dk); margin:0 0 10px}
  .block h2{font-size:clamp(24px,4.4vw,32px); margin-bottom:14px}
  .lead{font-size:17px; color:#273352; max-width:760px}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px}
  .grid2{display:grid; gap:20px; grid-template-columns:1fr}
  @media(min-width:820px){ .grid2{grid-template-columns:1fr 1fr} }
  ul.ticks{list-style:none; padding:0; margin:12px 0 0}
  ul.ticks li{position:relative; padding-left:26px; margin:6px 0}
  ul.ticks li:before{content:""; position:absolute; left:2px; top:9px; width:10px; height:10px; border-radius:50%; background:var(--green)}
  .fine{font-size:13.5px; color:var(--muted); margin-top:12px}

  .price{background:var(--navy); color:#fff; border-radius:14px; padding:26px 24px; text-align:center}
  .price .big{font:800 clamp(38px,8vw,56px)/1.1 Montserrat,sans-serif; color:var(--green)}
  .price .big small{font:700 .45em var(--head); color:#fff}
  .price p{margin:12px 0 0; color:#d6ddeb}
  .stats{display:grid; grid-template-columns:1fr; gap:12px; margin-top:18px}
  @media(min-width:640px){ .stats{grid-template-columns:repeat(3,1fr)} }
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center}
  .stat b{display:block; font:800 24px/1.3 var(--head); color:var(--navy)}
  .stat span{font-size:14px; color:var(--muted)}

  .buyback{border:2px solid var(--gold); background:#fff; border-radius:14px; padding:24px}
  .example{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    background:var(--navy); color:#fff; border-radius:10px; padding:16px; margin:16px 0; font:800 26px/1.2 var(--head)}
  .example .arrow{color:var(--gold)}
  .example small{display:block; font:500 12px/1.3 var(--body); color:#c9d2e3; margin-top:6px; text-align:center}
  .caution{background:#fdf3f2; border-left:4px solid var(--err); padding:12px 14px; border-radius:6px; font-size:14.5px; color:#4a1c18}

  /* ---------- registration ---------- */
  .reg{background:var(--navy); color:#fff; padding:56px 0}
  .reg h2{font-size:clamp(26px,5vw,36px)}
  .meet{display:grid; gap:10px; grid-template-columns:1fr; margin:20px 0 28px}
  @media(min-width:640px){ .meet{grid-template-columns:2fr 1fr 1fr} }
  .meet div{background:var(--navy-2); border:1px solid var(--navy-3); border-radius:10px; padding:14px 16px}
  .meet span{display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-lt)}
  .meet b{font:700 17px/1.4 var(--head)}
  .reg .cta{font-size:17px; color:#e4e9f3; margin:0}

  form.panel, .done{background:#fff; color:var(--ink); border-radius:14px; padding:24px; max-width:720px}
  .field{margin-bottom:18px; border:0; padding:0; min-width:0}
  .field label, .field .lbl{display:block; font-weight:600; font-size:15px; margin-bottom:6px; padding:0}
  .field .hint{font-weight:400; color:var(--muted); font-size:13px}
  input[type=text], input[type=tel], select, textarea{
    width:100%; font:16px var(--body); color:var(--ink); background:#fff;
    border:1.5px solid #cdd4e1; border-radius:8px; padding:12px 14px}
  textarea{min-height:96px; resize:vertical}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--green-dk); box-shadow:0 0 0 3px rgba(124,194,66,.25)}
  .check{display:flex; gap:10px; align-items:flex-start; font-size:15px; font-weight:400 !important}
  .check input{width:20px; height:20px; margin-top:3px; flex:none; accent-color:var(--green-dk)}
  .opt{border:1.5px solid #cdd4e1; border-radius:8px; padding:12px 14px; margin-top:8px; cursor:pointer}
  .opt:has(input:checked){border-color:var(--green-dk); background:#f3faec}
  .err{color:var(--err); font-size:13.5px; margin-top:6px; display:none}
  .field.bad .err{display:block}
  .field.bad input[type=text], .field.bad input[type=tel], .field.bad select, .field.bad .opt{border-color:var(--err)}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
  .formmsg{display:none; margin-top:14px; padding:12px 14px; border-radius:8px; background:#fdf3f2; color:#4a1c18; font-size:14.5px}
  .formmsg.show{display:block}
  .done{display:none}
  .done h3{font-size:24px; margin:8px 0 10px; color:var(--green-dk)}
  .done ol{padding-left:20px; margin:10px 0}
  .ref{display:inline-block; background:var(--paper); border:1px dashed #b9c2d3; border-radius:6px; padding:4px 10px; font:600 14px Montserrat,sans-serif}

  footer{background:#071227; color:#a9b4ca; font-size:13.5px; padding:28px 0 36px; text-align:center}
  footer p{max-width:780px; margin:0 auto 10px}
</style>
</head>
<body>

<!-- ============ LANGUAGE CHOOSER (shown first) ============ -->
<div class="langgate" id="langgate" role="dialog" aria-modal="true" aria-labelledby="lg-t" hidden>
  <div class="langbox">
    <p class="t" id="lg-t">DWARKA</p>
    <p>Choose your language<br>भाषा चुनें · ભાષા પસંદ કરો</p>
    <button type="button" data-lang="gu">ગુજરાતી</button>
    <button type="button" data-lang="hi">हिन्दी</button>
    <button type="button" data-lang="en">English</button>
  </div>
</div>

<!-- ============ HERO ============ -->
<header class="hero">
  <div class="wrap">
    <div class="langbar" aria-label="Language">
      <button type="button" data-lang="gu">ગુજરાતી</button>
      <button type="button" data-lang="hi">हिन्दी</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <span class="conf-pill" data-t="conf"></span>
    <h1>DWARKA</h1>
    <p class="sub" data-t="sub"></p>
    <span class="tag" data-t="tag"></span>
    <div class="hero-actions"><a class="btn btn-green" href="#register" data-t="cta_btn"></a></div>
  </div>
  <figure class="figure">
    <span class="badge" data-t="badge"></span>
    <img src="resort.jpg" srcset="resort-900.jpg 900w, resort.jpg 1672w" sizes="100vw"
         alt="AI-generated concept of a proposed beachfront resort with villas, pools and highway frontage" width="1672" height="941">
    <figcaption data-t="cap"></figcaption>
  </figure>
</header>

<!-- ============ CONFIDENTIALITY ============ -->
<div class="notice" role="note">
  <div class="wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a6a12" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <div data-t="notice"></div>
  </div>
</div>

<main>
<section class="block">
  <div class="wrap">
    <p class="eyebrow" data-t="proj_eb"></p>
    <h2 data-t="proj_h"></h2>
    <p class="lead" data-t="proj_lead"></p>
    <div class="grid2" style="margin-top:20px">
      <div class="card">
        <h3 style="font-size:18px" data-t="loc_h"></h3>
        <ul class="ticks"><li data-t="loc1"></li><li data-t="loc2"></li><li data-t="loc3"></li></ul>
        <p class="fine" data-t="loc_fine"></p>
      </div>
      <div class="card">
        <h3 style="font-size:18px" data-t="vis_h"></h3>
        <p style="margin:12px 0 0" data-t="vis_p"></p>
      </div>
    </div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <p class="eyebrow" data-t="part_eb"></p>
    <h2 data-t="part_h"></h2>
    <div class="price">
      <div class="big">₹400 <small data-t="price_unit"></small></div>
      <p data-t="price_p"></p>
    </div>
    <div class="stats">
      <div class="stat"><b data-t="st1b"></b><span data-t="st1"></span></div>
      <div class="stat"><b data-t="st2b"></b><span data-t="st2"></span></div>
      <div class="stat"><b data-t="st3b"></b><span data-t="st3"></span></div>
    </div>
    <p class="fine" data-t="part_fine"></p>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="buyback">
      <p class="eyebrow" style="color:#8a6a12" data-t="bb_eb"></p>
      <h2 data-t="bb_h"></h2>
      <p style="margin:0" data-t="bb_p"></p>
      <div class="example">
        <div><span data-t="ex1"></span><small data-t="ex1s"></small></div>
        <div class="arrow">→</div>
        <div><span data-t="ex2"></span><small data-t="ex2s"></small></div>
      </div>
      <p class="caution" data-t="caution"></p>
    </div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="grid2">
      <div class="card">
        <p class="eyebrow" data-t="disc_eb"></p>
        <h3 style="font-size:20px" data-t="own_h"></h3>
        <p data-t="own_p"></p>
        <ul class="ticks"><li data-t="own1"></li><li data-t="own2"></li></ul>
        <p class="fine" data-t="own_fine"></p>
      </div>
      <div class="card">
        <p class="eyebrow" data-t="disc_eb"></p>
        <h3 style="font-size:20px" data-t="mem_h"></h3>
        <p data-t="mem_p"></p>
        <p class="fine" data-t="mem_fine"></p>
      </div>
    </div>
  </div>
</section>
</main>

<!-- ============ REGISTRATION ============ -->
<section class="reg" id="register">
  <div class="wrap">
    <p class="eyebrow" style="color:var(--green)" data-t="reg_eb"></p>
    <h2 data-t="reg_h"></h2>
    <div class="meet">
      <div><span data-t="m_dates"></span><b data-t="m_dates_v"></b></div>
      <div><span data-t="m_time"></span><b data-t="m_time_v"></b></div>
      <div><span data-t="m_plat"></span><b>Google Meet</b></div>
    </div>
    <p class="cta" style="margin-bottom:22px" data-t="reg_cta"></p>

    <form class="panel" id="regform" novalidate>
      <div class="field" data-k="meeting">
        <label for="f-meeting" data-t="f_meeting"></label>
        <select id="f-meeting" name="meeting" required></select>
        <div class="err" data-t="e_meeting"></div>
      </div>
      <div class="field" data-k="name">
        <label for="f-name" data-t="f_name"></label>
        <input type="text" id="f-name" name="name" autocomplete="name" maxlength="120" required>
        <div class="err" data-t="e_name"></div>
      </div>
      <div class="field" data-k="mobile">
        <label for="f-mobile"><span data-t="f_mobile"></span> <span class="hint" data-t="h_mobile"></span></label>
        <input type="tel" id="f-mobile" name="mobile" autocomplete="tel" maxlength="25" value="+91 " required>
        <div class="err" data-t="e_mobile"></div>
      </div>
      <div class="field" data-k="city">
        <label for="f-city" data-t="f_city"></label>
        <input type="text" id="f-city" name="city" autocomplete="address-level2" maxlength="80" required>
        <div class="err" data-t="e_city"></div>
      </div>
      <div class="field" data-k="occupation">
        <label for="f-occ"><span data-t="f_occ"></span> <span class="hint" data-t="h_occ"></span></label>
        <input type="text" id="f-occ" name="occupation" autocomplete="organization-title" maxlength="100" required>
        <div class="err" data-t="e_occ"></div>
      </div>
      <fieldset class="field" data-k="status">
        <legend class="lbl" data-t="f_status"></legend>
        <label class="check opt"><input type="radio" name="status" value="Existing Richwealth investor"> <span data-t="s_yes"></span></label>
        <label class="check opt"><input type="radio" name="status" value="Not yet a Richwealth investor"> <span data-t="s_no"></span></label>
        <div class="err" data-t="e_status"></div>
      </fieldset>
      <div class="field" data-k="amount">
        <label for="f-amount" data-t="f_amount"></label>
        <select id="f-amount" name="amount" required>
          <option value="" data-t="a_sel"></option>
          <option value="₹4 lakh (1,000 sq. ft.)" data-t="a1"></option>
          <option value="₹8 lakh (2,000 sq. ft.)" data-t="a2"></option>
          <option value="₹12 lakh (3,000 sq. ft.)" data-t="a3"></option>
          <option value="₹20 lakh (5,000 sq. ft.)" data-t="a4"></option>
          <option value="₹40 lakh (10,000 sq. ft.)" data-t="a5"></option>
          <option value="Above ₹40 lakh" data-t="a6"></option>
          <option value="Not decided yet" data-t="a7"></option>
        </select>
        <div class="err" data-t="e_choose"></div>
        <p class="fine" style="margin-top:6px" data-t="a_fine"></p>
      </div>
      <div class="field">
        <label for="f-q"><span data-t="f_q"></span> <span class="hint" data-t="h_opt"></span></label>
        <textarea id="f-q" name="questions" maxlength="2000"></textarea>
      </div>
      <div class="field" data-k="consent">
        <label class="check"><input type="checkbox" id="f-consent" name="consent"> <span data-t="f_consent"></span></label>
        <div class="err" data-t="e_consent"></div>
      </div>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

      <button type="submit" class="btn btn-green" id="subbtn" style="width:100%" data-t="submit"></button>
      <div class="formmsg" id="formmsg" role="alert"></div>
    </form>

    <div class="done" id="done" role="status" tabindex="-1">
      <p class="eyebrow" data-t="d_eb"></p>
      <h3 data-t="d_h"></h3>
      <p><span id="d-thanks"></span> <span class="ref" id="d-ref"></span></p>
      <p><span data-t="d_meet"></span> <strong id="d-meet"></strong></p>
      <p style="margin-bottom:4px"><strong data-t="d_how"></strong></p>
      <ol><li data-t="d_li1"></li><li data-t="d_li2"></li><li data-t="d_li3"></li></ol>
      <p class="fine" data-t="d_fine"></p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p data-t="foot1"></p>
    <p data-t="foot2"></p>
  </div>
</footer>

(function(){
  var LANG = "en";
  var form = document.getElementById("regform");
  var btn  = document.getElementById("subbtn");
  var msg  = document.getElementById("formmsg");
  var sel  = document.getElementById("f-meeting");
  var gate = document.getElementById("langgate");
  function t(k){ return (T[LANG] && T[LANG][k]) || T.en[k] || ""; }

  function buildMeetings(){
    var keep = sel.value, now = Date.now();
    sel.innerHTML = "";
    var o = document.createElement("option"); o.value = ""; o.textContent = t("m_sel"); sel.appendChild(o);
    MEETINGS.forEach(function(m){
      if (now > Date.parse(m.end)) return;              // meeting already over
      var op = document.createElement("option"); op.value = m.v; op.textContent = m[LANG] || m.en; sel.appendChild(op);
    });
    sel.value = keep;
  }

  function setLang(l){
    LANG = T[l] ? l : "en";
    document.documentElement.lang = LANG;
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(function(el){ el.innerHTML = t(el.getAttribute("data-t")); });
    document.querySelectorAll(".langbar button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG); });
    buildMeetings();
    try { localStorage.setItem("dwk_lang", LANG); } catch(e){}
  }

  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); gate.hidden = true; });
  });

  // First visit: ask for the language. ?lang=gu|hi|en or a remembered choice skips the question.
  var q = (location.search.match(/[?&]lang=(en|hi|gu)/) || [])[1], saved = null;
  try { saved = localStorage.getItem("dwk_lang"); } catch(e){}
  setLang(q || saved || "en");
  if (!q && !saved){ gate.hidden = false; gate.querySelector("button").focus(); }

  function val(id){ return document.getElementById(id).value.trim(); }
  function mark(k, bad){ var f = form.querySelector('[data-k="'+k+'"]'); if(f) f.classList.toggle("bad", bad); return !bad; }
  function fail(text){ msg.innerHTML = text + " " + t("help"); msg.classList.add("show"); btn.disabled = false; btn.textContent = t("submit"); }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    msg.classList.remove("show");
    var mobile = val("f-mobile").replace(/[\s\-()]/g, "");
    var status = form.querySelector('input[name="status"]:checked');
    var ok = [
      mark("meeting",    !sel.value),
      mark("name",       val("f-name").length < 2),
      mark("mobile",     !/^\+\d{8,15}$/.test(mobile)),
      mark("city",       val("f-city").length < 2),
      mark("occupation", val("f-occ").length < 2),
      mark("status",     !status),
      mark("amount",     !val("f-amount")),
      mark("consent",    !document.getElementById("f-consent").checked)
    ].every(Boolean);
    if (!ok){ var b = form.querySelector(".bad input, .bad select"); if (b) b.focus(); return; }

    if (!ENDPOINT){ fail(t("not_open")); return; }

    btn.disabled = true; btn.textContent = t("saving");
    var payload = {
      meeting: sel.value, name: val("f-name"), mobile: val("f-mobile"), city: val("f-city"),
      occupation: val("f-occ"), status: status.value, amount: val("f-amount"),
      questions: val("f-q"), consent: "Yes", lang: LANG, website: form.website.value
    };
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 25000);

    // text/plain body = no CORS preflight; Apps Script returns readable JSON.
    fetch(ENDPOINT, { method: "POST", body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ return r.json(); })
      .then(function(res){
        clearTimeout(timer);
        if (!res || res.ok !== true){ throw new Error("not saved"); }
        // Only reached once the backend has confirmed the row is written.
        document.getElementById("d-thanks").textContent = t("d_thanks").replace("{n}", ", " + payload.name.split(" ")[0]);
        document.getElementById("d-ref").textContent = res.ref || "—";
        document.getElementById("d-meet").textContent = sel.options[sel.selectedIndex].text + " · " + t("m_time_v");
        form.style.display = "none";
        var d = document.getElementById("done"); d.style.display = "block"; d.focus();
      })
      .catch(function(){ clearTimeout(timer); fail(t("save_fail")); });
  });
})();
